const animationNames=["walk","run","grab","dig wall","dig floor","1x2 crouch","1x1 crawl","ambush crouch"];
const p=new URLSearchParams(location.search);
const wanted=(p.get("animation")||"walk").toLowerCase();
const wantedName=animationNames.find(n=>n.toLowerCase()===wanted)||animationNames[0];

const app=document.getElementById("app"), status=document.getElementById("status"), err=document.getElementById("error");
status.textContent=wantedName;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,0.01,1000);
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.enablePan=false;

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2.0));
const key=new THREE.DirectionalLight(0xffffff,2.4); key.position.set(5,8,6); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,0.8); fill.position.set(-5,3,-5); scene.add(fill);

function resize(){
 const w=app.clientWidth||300,h=app.clientHeight||300;
 camera.aspect=w/h; camera.updateProjectionMatrix(); renderer.setSize(w,h,false);
}
new ResizeObserver(resize).observe(app); resize();

function fail(text){err.textContent=text;err.style.display="grid";}

const bytes=Uint8Array.from(atob(MODEL),c=>c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer,"",(gltf)=>{
 const model=gltf.scene; scene.add(model);

 model.traverse(o=>{
   if(o.isMesh && o.material){
     const ms=Array.isArray(o.material)?o.material:[o.material];
     ms.forEach(m=>{
       if(m.map){m.map.minFilter=THREE.NearestFilter;m.map.magFilter=THREE.NearestFilter;m.map.generateMipmaps=false;m.map.needsUpdate=true;}
     });
   }
 });

 const box=new THREE.Box3().setFromObject(model);
 const center=box.getCenter(new THREE.Vector3()), size=box.getSize(new THREE.Vector3());
 model.position.x-=center.x; model.position.z-=center.z;
 const d=Math.max(size.x,size.y,size.z);
 camera.position.set(d*1.5,d*.8,d*1.5);
 controls.target.set(0,size.y*.48,0);
 controls.minDistance=d*.3; controls.maxDistance=d*5; controls.update();

 if(!gltf.animations.length){fail("No animations in GLB.");return;}

 const animIndex=gltf.animations.findIndex(a=>a.name.toLowerCase()===wantedName.toLowerCase());
 const clip=gltf.animations[animIndex>=0?animIndex:0];
 const jsonAnim=gltf.parser.json.animations[animIndex>=0?animIndex:0];

 // Blockbench exports duplicate node names. Rebind every track by GLTF node INDEX
 // so Three.js never has to guess which duplicate-named object a track belongs to.
 Promise.all(jsonAnim.channels.map(c=>gltf.parser.getDependency("node",c.target.node))).then(nodes=>{
   const fixedTracks=clip.tracks.map((track,i)=>{
     const c=jsonAnim.channels[i], node=nodes[i];
     const path=c.target.path==="translation"?"position":c.target.path==="rotation"?"quaternion":c.target.path;
     const TrackClass=track.constructor;
     return new TrackClass(node.uuid+"."+path,track.times,track.values,track.getInterpolation());
   });
   const fixedClip=new THREE.AnimationClip(clip.name,clip.duration,fixedTracks);
   const mixer=new THREE.AnimationMixer(model);
   mixer.clipAction(fixedClip).setLoop(THREE.LoopRepeat,Infinity).play();

   const clock=new THREE.Clock();
   function frame(){
     requestAnimationFrame(frame);
     mixer.update(clock.getDelta());
     controls.update();
     renderer.render(scene,camera);
   }
   frame();
 }).catch(e=>{console.error(e);fail("Animation setup failed.");});
},undefined,e=>{console.error(e);fail("Could not load the 3D model.");});
